name: land-stack

# Merges an ordered list of same-repo PR heads onto main, then runs the
# same verify steps as ci.yml (lint, typecheck, vitest, next build).
# workflow_dispatch is the real entry point. pull_request runs only when
# this file changes, using LAND_STACK_DEFAULT, so the check can execute
# before the workflow exists on the default branch.
on:
  workflow_dispatch:
    inputs:
      prs:
        description: "Ordered PR numbers to merge onto main (comma- or space-separated)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/land-stack.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: land-stack-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.prs || 'default' }}
  cancel-in-progress: true

jobs:
  land-stack:
    name: land-stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Passing stack used for pull_request runs of this file.
      # workflow_dispatch replaces it with the prs input.
      LAND_STACK_DEFAULT: "20 31"
      # Matches ci.yml job verify. No repository secrets and no API keys.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Merge PR stack
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PRS: ${{ github.event.inputs.prs }}
          REPO: ${{ github.repository }}
          # Automatic GITHUB_TOKEN for this job (read-only). Not a repository secret.
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: land-stack
          GIT_AUTHOR_EMAIL: land-stack@users.noreply.github.com
          GIT_COMMITTER_NAME: land-stack
          GIT_COMMITTER_EMAIL: land-stack@users.noreply.github.com
        run: |
          set -euo pipefail
          LC_ALL=C
          export GIT_MERGE_AUTOEDIT=no

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            raw="${INPUT_PRS:-}"
          else
            raw="${LAND_STACK_DEFAULT}"
          fi

          # Reject anything that is not an ASCII digit, comma, or ASCII whitespace
          # before the value is interpolated into a refspec or API path.
          allowed=$(printf '%s' '0-9, '"$(printf '\t\r\n ')")
          stripped=$(printf '%s' "${raw}" | tr -d "${allowed}")
          if [ -n "${stripped}" ] || [ -z "${raw}" ]; then
            echo "::error::PR list must be comma- or space-separated integers only"
            exit 1
          fi

          normalized=$(printf '%s' "${raw}" | tr ',\t\r\n' ' ' | tr -s ' ' | sed 's/^ //;s/ $//')
          if [ -z "${normalized}" ] || ! printf '%s\n' "${normalized}" | grep -Eq '^[0-9]+( [0-9]+)*$'; then
            echo "::error::PR list must be comma- or space-separated integers only"
            exit 1
          fi

          read -r -a prs <<< "${normalized}"
          if [ "${#prs[@]}" -gt 20 ]; then
            echo "::error::PR list is limited to 20 pull requests"
            exit 1
          fi

          if ! printf '%s\n' "${REPO}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Unexpected repository name"
            exit 1
          fi

          echo "Land stack (${EVENT_NAME}): ${normalized}"
          echo "Base: $(git rev-parse HEAD)"

          for pr in "${prs[@]}"; do
            echo "Resolving PR #${pr}"
            if ! meta=$(gh api --jq '[.head.repo.full_name // "", .head.sha // "", .state // ""] | @tsv' "repos/${REPO}/pulls/${pr}"); then
              echo "::error::Could not read PR #${pr} in ${REPO}"
              exit 1
            fi
            IFS=$'\t' read -r full_name sha state <<< "${meta}"

            if [ "${full_name}" != "${REPO}" ]; then
              echo "::error::Refusing PR #${pr}: head repository is '${full_name:-none}', not ${REPO}. Fork pull requests are not merged."
              exit 1
            fi
            if ! printf '%s\n' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::PR #${pr} head is not a 40-character commit SHA"
              exit 1
            fi

            # Fetch the pull ref, then merge only if it is exactly the API head.
            # The header is per command. persist-credentials: false keeps it out of git config.
            if [ -n "${GH_TOKEN:-}" ]; then
              git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
                fetch --no-tags origin "pull/${pr}/head"
            else
              git fetch --no-tags origin "pull/${pr}/head"
            fi
            fetched=$(git rev-parse FETCH_HEAD)
            if [ "${fetched}" != "${sha}" ]; then
              echo "::error::PR #${pr} moved while resolving (API ${sha}, git ${fetched}). Refusing to merge."
              exit 1
            fi
            git cat-file -e "${sha}^{commit}"

            echo "Merging PR #${pr} (${sha}, ${state})"
            merge_log=$(mktemp)
            set +e
            git merge --no-ff --no-commit "${sha}" >"${merge_log}" 2>&1
            merge_rc=$?
            set -e
            cat "${merge_log}"
            rm -f "${merge_log}"

            if [ "${merge_rc}" -ne 0 ]; then
              echo "::error::Merge conflict applying PR #${pr} (${sha})"
              echo "LAND-STACK MERGE CONFLICT"
              echo "PR: #${pr}"
              echo "Head: ${sha}"
              echo "Conflicting files:"
              found=0
              while IFS= read -r -d '' f; do
                found=1
                printf '  %s\n' "${f}"
                # Skip the file= annotation when the path could break workflow-command syntax.
                case "${f}" in
                  *[%:,[:space:]]*)
                    echo "::error::Merge conflict while applying PR #${pr} in a path that was not annotated"
                    ;;
                  *)
                    echo "::error file=${f}::Merge conflict in ${f} while applying PR #${pr}"
                    ;;
                esac
              done < <(git diff --name-only --diff-filter=U -z | sort -z)
              if [ "${found}" -eq 0 ]; then
                echo "(no unmerged paths reported)"
                git status --short
              fi
              exit 1
            fi

            if git diff --cached --quiet; then
              echo "PR #${pr} (${sha}) is already in the tree"
            else
              git commit -m "land-stack: merge PR #${pr} (${sha})"
            fi
          done

          echo "Merged stack ${normalized} at $(git rev-parse HEAD)"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Land stack"
              echo ""
              echo "Merged onto \`main\` in order: \`${normalized}\`"
              echo ""
              echo "Result: \`$(git rev-parse HEAD)\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jqj-store/package-lock.json

      - name: Install
        working-directory: jqj-store
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: jqj-store
        run: npm run lint

      - name: Typecheck
        working-directory: jqj-store
        run: npm run typecheck

      - name: Test
        working-directory: jqj-store
        run: npm test

      - name: Build
        working-directory: jqj-store
        run: npm run build
